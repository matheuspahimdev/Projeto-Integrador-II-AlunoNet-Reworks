<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal do Aluno</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-shell">

  <nav-bar></nav-bar>

  <main class="page-content">

    <section class="hero-header">
      <h1 class="display-6">Bons estudos, aluno!</h1>
      <div class="hero-header__stats">
        métricas do aluno — a definir<br>
        (ex.: média geral, frequência, pendências, próxima aula)
      </div>
    </section>

    <!-- 2 boxes gigantes, esquerda e direita, esticando até o fim da tela
         (sem precisar rolar) — cada uma com g-col-2, numa única linha que
         ocupa 100% do espaço vertical restante. -->
    <div class="grid-mesh">
      <div class="g-box bg-body-secondary border rounded-4 g-col-2"></div>
      <div class="g-box bg-body-secondary border rounded-4 g-col-2"></div>
    </div>

  </main>
</div>

<!-- FORA do .app-shell de propósito: a partir daqui a página rola
     normalmente, com altura natural, sem espremer nada. -->
<div class="page-content-extra">
  <div class="grid-mesh grid-mesh--static">
    <div class="g-box bg-body-secondary border rounded-4 g-col-2 g-row-2"></div>
    <div class="g-box bg-body-secondary border rounded-4 g-col-1"></div>
    <div class="g-box bg-body-secondary border rounded-4 g-col-1"></div>
    <div class="g-box bg-body-secondary border rounded-4 g-col-2"></div>
    <div class="g-box bg-body-secondary border rounded-4 g-col-3"></div>
    <div class="g-box bg-body-secondary border rounded-4 g-col-1"></div>
  </div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="components.js" defer></script>

</body>
</html>
